[workspace]
resolver = "3"
members = [
    "crates/vhdesk-proto",
    "crates/vhdesk-crypto",
    "crates/vhdesk-libvpx-sys",
    "crates/vhdesk-capture",
    "crates/vhdesk-codec",
    "crates/vhdesk-input",
    "crates/vhdesk-audio",
    "crates/vhdesk-transport",
    "crates/vhdesk-host",
    "crates/vhdesk-viewer",
    "crates/vhdesk-server",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["VHDesk contributors"]
repository = "https://github.com/josevillah/vhdesk"

# Los binarios de escritorio son GPL-3.0. vhdesk-server sobreescribe este campo con
# AGPL-3.0 en su propio manifiesto: es un servicio en red y la clausula de red importa.
license = "GPL-3.0-only"

# Version unica por dependencia para todo el workspace. Cada crate la hereda con
# `dep.workspace = true`, de modo que no puedan divergir entre crates.
[workspace.dependencies]
vhdesk-proto = { path = "crates/vhdesk-proto" }
vhdesk-crypto = { path = "crates/vhdesk-crypto" }
vhdesk-capture = { path = "crates/vhdesk-capture" }
vhdesk-codec = { path = "crates/vhdesk-codec" }
vhdesk-input = { path = "crates/vhdesk-input" }
vhdesk-audio = { path = "crates/vhdesk-audio" }
vhdesk-transport = { path = "crates/vhdesk-transport" }
vhdesk-libvpx-sys = { path = "crates/vhdesk-libvpx-sys" }

anyhow = "1.0.104"
bindgen = "0.72.1"
bytes = "1.12.1"
pkg-config = "0.3.34"
png = "0.18.1"
quinn = "0.11.11"
# Rango abierto a proposito, no fijado a una version concreta: rcgen 0.14.8 subio su MSRV a
# 1.88 y el nuestro es 1.85. Con `rust-version = "1.85"` declarado y el resolver de la
# edicion 2024 (que es consciente de la MSRV), cargo elige 0.14.7, la ultima compatible.
# Si alguien fija aqui `0.14.8` o posterior, el job `msrv` del CI lo denunciara.
rcgen = "0.14"
# La version la marca quinn: rustls 0.24 todavia es prerelease y quinn 0.11 enlaza con la
# 0.23. Fijarla aqui evita acabar con dos rustls distintas en el arbol.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Conversion de color con SIMD despachado en tiempo de ejecucion. Solo dependencia de
# desarrollo mientras se evalua contra la implementacion escalar propia.
# `fast_mode` solo se usa en el banco de pruebas, para comparar contra el algoritmo de
# libyuv. En produccion se usa el modo Balanced, que en la medicion salio igual de rapido
# y es mas preciso.
yuv = { version = "0.8.17", features = ["fast_mode"] }

# Ventana del viewer. wgpu no se declara aparte a proposito: se usa el que reexporta
# eframe (`eframe::wgpu`), porque dos versiones distintas en el arbol darian tipos
# incompatibles justo en la frontera entre el callback de pintado y nuestro pipeline.
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
# TRAMPA, no lo borres: los backends de wgpu (Vulkan/DX12/Metal) se activan a traves de la
# dependencia debil `egui-wgpu?/default`, que viene de la feature `default` de eframe. Al
# poner `default-features = false` en eframe se pierde esa activacion y la instancia wgpu se
# queda sin ningun backend. El sintoma es un PANIC al crear la instancia, en tiempo de
# ejecucion, no un error de compilacion: de esas que cuestan una tarde entera. Declarar
# `egui-wgpu` aqui con sus features por defecto devuelve `wgpu/default` al arbol.
egui-wgpu = "0.32.3"
pollster = "1.0.1"

windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# El pipeline de video es sensible a la latencia: preferimos un binario mas lento de
# compilar a cambio de que el optimizador vea todo el grafo de llamadas de una vez.
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
